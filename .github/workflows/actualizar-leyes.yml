name: Actualizar leyes (Gaceta Oficial)

on:
  schedule:
    # Todos los días a las 06:20 UTC (08:20 en Madrid / 00:20 en La Habana)
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar y traducir normas nuevas
        run: python3 scripts/actualizar_leyes.py

      - name: Guardar cambios si los hay
        run: |
          git config user.name  "aduana-cuba-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/leyes.json
          if git diff --cached --quiet; then
            echo "Sin normas nuevas hoy."
          else
            git commit -m "Leyes: traducción automática de normas nuevas ($(date -u +%F))"
            git push
          fi
